name: Aureon AI Development Worker
on:
  workflow_dispatch:
    inputs:
      role:
        description: 'Worker role'
        type: choice
        options: [research, planning, implementation, design, quality, deployment]
        required: true
        default: research
      task:
        description: 'Specific user task'
        required: true
        default: 'Investigate blocked provider specifications and identify a verified implementation plan'
  schedule:
    - cron: '23 10 * * *'
permissions:
  contents: read
  models: read
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Execute model-backed worker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUREON_ROLE: ${{ inputs.role || 'research' }}
          AUREON_TASK: ${{ inputs.task || 'Investigate blocked API specifications and propose testable fixes' }}
        run: node agents/execute-job.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aureon-agent-report
          path: agent-results/latest.json
          if-no-files-found: error
